# Opens a pull request when a dependency has a security fix or a new version.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    ignore:
      # PHPUnit 13 needs PHP 8.4, and the kit supports 8.3, so CI can't install it. Lift this when the kit's minimum
      # is 8.4. PHPUnit 12 updates still come.
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
