name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability found in a dependency shows up even when nobody pushes.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build

      - run: cp .env.example .env && php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test

      - name: Known vulnerabilities in PHP packages
        run: composer audit

      - name: Known vulnerabilities in npm packages
        run: npm audit --audit-level=high
